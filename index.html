<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Basic Security Headers (those that work in meta tags) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), interest-cohort=()" />
    
    <!-- Note: CSP and X-Frame-Options will be handled by server headers (.htaccess) -->
    
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    
    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Primary SEO Meta Tags -->
    <title>Govind Vyas - Software Developer | Vue.js, Java, Node.js Expert</title>
    <meta name="title" content="Govind Vyas - Software Developer | Vue.js, Java, Node.js Expert" />
    <meta name="description" content="Govind Vyas is a Software Developer specializing in Vue.js, Java, Node.js, and modern web technologies. Building scalable web applications with expertise in full-stack development." />
    <meta name="keywords" content="Govind Vyas, Software Developer, Vue.js Developer, Java Developer, Node.js Developer, Full Stack Developer, Web Developer India, govindvyas, govind vyas portfolio" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="author" content="Govind Vyas" />
    <meta name="google-site-verification" content="" />
    <link rel="canonical" href="https://govindvyas.com/" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://govindvyas.com/" />
    <meta property="og:title" content="Govind Vyas - Software Developer | Vue.js, Java, Node.js Expert" />
    <meta property="og:description" content="Govind Vyas is a Software Developer specializing in Vue.js, Java, Node.js, and modern web technologies. Building scalable web applications." />
    <meta property="og:image" content="https://govindvyas.com/og-image.png" />
    <meta property="og:site_name" content="Govind Vyas Portfolio" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://govindvyas.com/" />
    <meta property="twitter:title" content="Govind Vyas - Software Developer | Vue.js, Java, Node.js Expert" />
    <meta property="twitter:description" content="Govind Vyas is a Software Developer specializing in Vue.js, Java, Node.js, and modern web technologies." />
    <meta property="twitter:image" content="https://govindvyas.com/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Govind Vyas",
      "url": "https://govindvyas.com",
      "image": "https://govindvyas.com/og-image.png",
      "jobTitle": "Software Developer",
      "worksFor": {
        "@type": "Organization",
        "name": "FirstCry"
      },
      "sameAs": [
        "https://github.com/govindavyas",
        "https://www.linkedin.com/in/govindavyas/"
      ],
      "knowsAbout": ["Vue.js", "Java", "Node.js", "JavaScript", "TypeScript", "Angular", "PostgreSQL", "MySQL", "Express.js", "Full Stack Development"],
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "India"
      },
      "email": "govindav44@gmail.com"

    <!-- Structured Data - Website Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        "@type": "Person",

      }

    <!-- Prevent sensitive data exposure -->
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />
    
    <!-- Favicon Security -->
    <link rel="shortcut icon" href="/vite.svg" type="image/svg+xml" />
    
    <!-- Critical CSS - Inline for FCP -->
    <style>
      /* Critical above-the-fold styles for instant render */
      *{margin:0;padding:0;box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a0a0f;color:#fff;overflow-x:hidden}

      .splash-container{position:fixed;inset:0;z-index:9999;background:#0a0a0f;display:flex;align-items:center;justify-content:center}

    <!-- Non-render-blocking font loading with font-display: swap -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" media="print" onload="this.media='all'" />

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Space+Grotesk:wght@500;700&display=swap" />
